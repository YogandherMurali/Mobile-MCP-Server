version: '3.8'

services:
  mobile-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mobile-mcp-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - ALLOWED_ORIGINS=*
    volumes:
      # Mount logs directory for persistent logging (optional)
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mcp-network:
    driver: bridge

# Optional: Add volume for persistent data if needed in the future
volumes:
  mcp-logs:
    driver: local
